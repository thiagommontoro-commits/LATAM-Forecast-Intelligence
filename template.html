<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AGCO LATAM - Forecast Intelligence</title>
    <!-- Importando Chart.js para os gráficos -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* ===== BASE — Identidade "Early Signals" (AGCO) ===== */
        :root {
            --agco-red: #cc0000;
            --agco-black: #111111;
            --agco-dark-gray: #333333;
            --agco-light-gray: #f4f4f4;
            --text-main: #222222;
            --white: #ffffff;
            --bg-color: #e9ecef;
            --pos-color: #385723;
            --neg-color: #c00000;
            --neutral-color: #7f6000;
            --farol-positive-bg: #e2f0d9;
            --farol-positive-text: #385723;
            --farol-positive-dot: #70ad47;
            --farol-warning-bg: #fff2cc;
            --farol-warning-text: #7f6000;
            --farol-warning-dot: #ffc000;
            --farol-critical-bg: #fce4d6;
            --farol-critical-text: #c65911;
            --farol-critical-dot: #c00000;
        }
        *, *::before, *::after { box-sizing: border-box; }
        body {
            font-family: 'Arial', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            line-height: 1.5;
        }
        /* --- HEADER & KPIs --- */
        .dashboard-header {
            max-width: 1350px;
            margin: 0 auto 25px auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            background-color: var(--agco-black);
            color: var(--white);
            padding: 30px 40px;
            border-bottom: 6px solid var(--agco-red);
            border-radius: 4px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }
        .header-title h1 {
            margin: 0;
            color: var(--white);
            font-size: 28px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }
        .header-title p {
            margin: 5px 0 0 0;
            color: #b0b0b0;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .kpi-container { display: flex; gap: 15px; }
        .kpi-card {
            background: #1d1d1d;
            border: 1px solid #2f2f2f;
            border-left: 4px solid var(--agco-red);
            padding: 14px 22px;
            border-radius: 4px;
            min-width: 170px;
        }
        .kpi-card.positive { border-left-color: var(--farol-positive-dot); }
        .kpi-card.negative { border-left-color: var(--agco-red); }
        .kpi-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: bold;
            color: #a0a0a0;
            margin-bottom: 5px;
        }
        .kpi-value { font-size: 24px; font-weight: 900; color: var(--white); }
        /* --- TABS DE PAÍS --- */
        .country-tabs-nav {
            max-width: 1350px;
            margin: 0 auto 25px auto;
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            border-bottom: 3px solid var(--agco-black);
            padding-bottom: 5px;
        }
        .country-tab-btn {
            background-color: var(--agco-light-gray);
            color: var(--agco-dark-gray);
            border: none;
            padding: 12px 20px;
            font-size: 13px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-radius: 4px 4px 0 0;
            cursor: pointer;
            transition: all 0.2s;
        }
        .country-tab-btn:hover { background-color: #e0e0e0; color: var(--agco-black); }
        .country-tab-btn.active {
            background-color: var(--agco-black);
            color: var(--white);
            border-bottom: 3px solid var(--agco-red);
        }
        .country-tab-content { max-width: 1350px; margin: 0 auto; }
        /* --- TABS DE PRODUTO --- */
        .prod-tabs-nav { display: flex; gap: 5px; }
        .prod-tab-btn {
            background: transparent;
            border: none;
            padding: 12px 18px;
            font-size: 13px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #666666;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: 0.2s;
        }
        .prod-tab-btn.active { color: var(--agco-black); border-bottom-color: var(--agco-red); }
        .prod-tab-btn:hover:not(.active) { background: var(--agco-light-gray); color: var(--agco-black); }
        /* --- TABELAS --- */
        .table-container {
            background: var(--white);
            border: 1px solid #e0e0e0;
            border-top: 5px solid var(--agco-red);
            border-radius: 4px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
            overflow-x: auto;
        }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { padding: 10px 14px; text-align: left; border-bottom: 1px solid #e0e0e0; }
        th {
            background-color: var(--agco-light-gray);
            color: var(--agco-black);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        td.num { text-align: center; }
        .positive { color: var(--farol-positive-text); }
        .negative { color: var(--farol-critical-dot); }
        /* --- BOTÃO EXCEL --- */
        .btn-excel {
            display: flex;
            align-items: center;
            gap: 8px;
            background-color: var(--agco-black);
            color: white;
            border: none;
            padding: 9px 16px;
            border-radius: 2px;
            cursor: pointer;
            font-weight: bold;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: 0.2s;
        }
        .btn-excel:hover { background-color: var(--agco-red); }
        /* --- FARÓIS / LEGENDA --- */
        .farol {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            font-size: 11px;
            font-weight: bold;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }
        .farol-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
        .farol-positive { background-color: var(--farol-positive-bg); color: var(--farol-positive-text); }
        .farol-positive .farol-dot { background-color: var(--farol-positive-dot); }
        .farol-warning { background-color: var(--farol-warning-bg); color: var(--farol-warning-text); }
        .farol-warning .farol-dot { background-color: var(--farol-warning-dot); }
        .farol-critical { background-color: var(--farol-critical-bg); color: var(--farol-critical-text); }
        .farol-critical .farol-dot { background-color: var(--farol-critical-dot); }
        /* --- CONTROLES DE IDIOMA --- */
        .lang-controls { max-width: 1350px; margin: 0 auto 12px auto; text-align: right; }
        .lang-btn {
            background-color: #2a2a2a;
            border: none;
            color: #a0a0a0;
            padding: 6px 12px;
            margin-left: 4px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 2px;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
        }
        .lang-btn:hover { background-color: #444; color: var(--white); }
        .lang-btn.active { background-color: var(--agco-red); color: var(--white); }
        .i18n-text { display: none; }
        /* --- RODAPÉ --- */
        .es-footer {
            max-width: 1350px;
            margin: 35px auto 0 auto;
            padding: 18px 20px;
            background-color: var(--agco-black);
            color: #b0b0b0;
            border-top: 6px solid var(--agco-red);
            border-radius: 4px;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="lang-controls">
        <button class="lang-btn active" onclick="setLanguage('pt')">PT</button>
        <button class="lang-btn" onclick="setLanguage('en')">EN</button>
        <button class="lang-btn" onclick="setLanguage('es')">ES</button>
    </div>

    <!-- HEADER -->
    <div class="dashboard-header">
        <div class="header-title">
            <h1>AGCO LATAM - Forecast Intelligence</h1>
            <p><span data-i18n="updated">Atualizado</span>: {update_date} | <span data-i18n="version">Versão</span>: {forecast_version}</p>
        </div>
        <div class="kpi-container">
            <div class="kpi-card info">
                <div class="kpi-title" data-i18n="kpi_vol_title">Volume Total Projetado</div>
                <div class="kpi-value" style="color: var(--agco-blue);">{total_atual_str}</div>
            </div>
            <div class="kpi-card {cor_kpi}">
                <div class="kpi-title" data-i18n="kpi_var_title">Variação de Volume</div>
                <div class="kpi-value" style="color: {cor_texto};">{texto_var}</div>
            </div>
        </div>
    </div>

    <!-- NAVEGAÇÃO DE PAÍSES -->
    <div class="country-tabs-nav">
        {html_country_tabs}
    </div>

    <!-- CONTEÚDO DOS PAÍSES (INJETADO PELO PYTHON) -->
    {html_country_contents}

    <script>
        // --- DADOS INJETADOS PELO PYTHON ---
        const translations = {translations_json};
        const chartsData = {all_charts_json};
        let currentLang = 'pt';
        let renderizedCharts = {};

        // --- SISTEMA DE ABAS (PAÍSES) ---
        function openCountry(evt, countryName) {
            let i, tabcontent, tablinks;
            tabcontent = document.getElementsByClassName("country-tab-content");
            for (i = 0; i < tabcontent.length; i++) {
                tabcontent[i].style.display = "none";
                tabcontent[i].classList.remove("active");
            }
            tablinks = document.getElementsByClassName("country-tab-btn");
            for (i = 0; i < tablinks.length; i++) {
                tablinks[i].classList.remove("active");
            }
            document.getElementById(countryName).style.display = "block";
            document.getElementById(countryName).classList.add("active");
            evt.currentTarget.classList.add("active");

            // Aciona renderização de gráficos na aba ativa
            renderActiveCharts();
        }

        // --- SISTEMA DE ABAS (PRODUTOS) ---
        function openProduct(evt, prodId, countryName) {
            let i, tabcontent, tablinks;
            let parentDiv = document.getElementById(countryName);
            
            tabcontent = parentDiv.getElementsByClassName("prod-tab-content");
            for (i = 0; i < tabcontent.length; i++) {
                tabcontent[i].style.display = "none";
                tabcontent[i].classList.remove("active");
            }
            tablinks = parentDiv.getElementsByClassName("prod-tab-btn");
            for (i = 0; i < tablinks.length; i++) {
                tablinks[i].classList.remove("active");
            }
            document.getElementById(prodId).style.display = "block";
            document.getElementById(prodId).classList.add("active");
            evt.currentTarget.classList.add("active");

            renderActiveCharts();
        }

        // --- RENDERIZAÇÃO DE GRÁFICOS (CHART.JS) ---
        function renderActiveCharts() {
            // Pega todos os conteúdos de produto que estão visíveis no momento
            const activeContents = document.querySelectorAll('.prod-tab-content.active');
            
            activeContents.forEach(content => {
                // Verifica se o parent (país) também está ativo
                if (content.closest('.country-tab-content').classList.contains('active')) {
                    const prodId = content.id;
                    const canvasId = 'canvas_' + prodId;
                    
                    if (!renderizedCharts[canvasId] && chartsData[prodId]) {
                        const ctx = document.getElementById(canvasId).getContext('2d');
                        renderizedCharts[canvasId] = new Chart(ctx, {
                            type: 'bar',
                            data: chartsData[prodId],
                            options: {
                                responsive: true,
                                maintainAspectRatio: false,
                                plugins: {
                                    legend: { position: 'top' }
                                },
                                scales: {
                                    y: { beginAtZero: true }
                                }
                            }
                        });
                    }
                }
            });
        }

        // --- SISTEMA DE TRADUÇÃO (I18N) ---
        function setLanguage(lang) {
            currentLang = lang;
            
            // Atualiza botões
            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            // Atualiza chaves estáticas [data-i18n]
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[lang] && translations[lang][key]) {
                    el.innerText = translations[lang][key];
                }
            });

            // Atualiza chaves estáticas de Title (Tooltip) [data-i18n-title]
            document.querySelectorAll('[data-i18n-title]').forEach(el => {
                const key = el.getAttribute('data-i18n-title');
                if (translations[lang] && translations[lang][key]) {
                    el.setAttribute('title', translations[lang][key]);
                }
            });

            // Atualiza explicações da IA dinâmicas
            document.querySelectorAll('.i18n-text').forEach(el => el.style.display = 'none');
            document.querySelectorAll('.i18n-text.lang-' + lang).forEach(el => el.style.display = 'inline');
        }

        // --- EXPORTAR PARA EXCEL (Formato CSV) ---
        function exportProdExcel(prodId, fileName) {
            let table = document.getElementById('table_' + prodId);
            if (!table) return;

            let csv = [];
            let rows = table.querySelectorAll("tr");
            
            for (let i = 0; i < rows.length; i++) {
                let row = [], cols = rows[i].querySelectorAll("td, th");
                
                for (let j = 0; j < cols.length; j++) {
                    let data = cols[j].innerText.replace(/(\r\n|\n|\r)/gm, "").trim();
                    // Limpa % e caracteres extras para excel entender como número
                    data = data.replace(/"/g, '""');
                    row.push('"' + data + '"');
                }
                csv.push(row.join(";"));
            }

            let csvFile = new Blob(["\uFEFF"+csv.join("\n")], {type: "text/csv;charset=utf-8;"});
            let downloadLink = document.createElement("a");
            downloadLink.download = fileName + "_Forecast.csv";
            downloadLink.href = window.URL.createObjectURL(csvFile);
            downloadLink.style.display = "none";
            document.body.appendChild(downloadLink);
            downloadLink.click();
            document.body.removeChild(downloadLink);
        }

        // --- INICIALIZAÇÃO ---
        window.onload = function() {
            setLanguage('pt');
            renderActiveCharts();
        };

    </script>
    <div class="es-footer">Desenvolvido por Thiago Medea Montoro | Global Reporting &amp; Analytics</div>
</body>
</html>
